<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Duo blur effect</title>
    <meta name="description" content="A foldable phone in three.js: drag or tap to fold, orbit around it." />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff;
        font: 15px/1.5 system-ui, -apple-system, sans-serif; color: #111; }
      canvas { display: block; touch-action: none; cursor: grab; }
      canvas.dragging { cursor: grabbing; }

      .repo-button {
        position: fixed; right: 20px; bottom: 20px; z-index: 2;
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 14px 10px 12px; border-radius: 999px;
        background: #111; color: #fff; text-decoration: none; font-size: 14px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .repo-button:hover { transform: scale(1.04); }
      .repo-button svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
  </head>

    <a class="repo-button" href="https://github.com/Matoseb/iphone-duo-blur" target="_blank" rel="noopener" aria-label="Source on GitHub">
